[package]
name = "jhol-core"
version = "2.0.0"
edition = "2021"
description = "Core logic for Jhol: cache, install, doctor, registry, lockfile"
license-file = "../../LICENSE"
repository = "https://github.com/bhuvanprakash/jhol"

[features]
lifedebug = []
# NOTE: `http-reqwest` is intentionally NOT default. It pulls reqwest + the
# HTTP/2 stack for `http2_download`, which is resume-only (slower than ureq
# on packuments, parity on tarballs). Opt in with `--features http-reqwest`.
# `tokio` stays mandatory: `cas/cas.rs` uses it unconditionally.
default = ["pipeline"]  # pipeline (JGrid) is the only default extra
http-reqwest = ["dep:reqwest"]
# Accelerated hashing experiment; runtime CPU detection preserves soft fallback.
hardware-sha = ["sha2/asm"]
pipeline = []  # JGrid instant-materialization layer (in-tree module)

[dependencies]
jhol-treecheck = { path = "../jhol-treecheck" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
# `gzip` is NOT a default ureq feature, and without it no `Accept-Encoding` is
# sent — the registry then returns packuments uncompressed (`next` is 31.3 MB
# instead of 2.4 MB, 13.2x more). See INNOVATION_LOG E83.
ureq = { version = "2.10", features = ["gzip"] }
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
semver = "1.0"
base64 = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "http2", "gzip", "brotli"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util"] }
rand = "0.8"
lazy_static = "1.4"

# JAGR-2: PubGrub algorithm dependencies
dashmap = "5.5"
rayon = "1.8"  # Work-stealing parallelism (replaces crossbeam)


# JAGR-2: Memory-efficient data structures
bumpalo = "3.14"

# JAGR-2: Reflink for copy-on-write (Linux/macOS)
reflink-copy = "0.1"

# JAGR-2: CPU detection for parallelism
num_cpus = "1.16"

# JHOL Global Cache - Memory-mapped files
memmap2 = "0.9"
dirs = "5.0"

# JHOL: Faster decompression (like Bun uses libdeflate)
libdeflater = "1.24"
thiserror = "2.0.18"


# Phase 1-4: Exploit Rust Brutally
bincode = "1.3"
zstd = "0.13"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }

libc = "0.2"

# Error handling
hex = "0.4"

# JAGR-3: Graph IR dependencies
ahash = "0.8"
smallvec = "1.13"


[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
