[package]
name = "jhol-remote"
version = "0.1.0"
edition = "2021"
description = "Optional remote CAS / action-cache client (blueprint Phase D)"
license-file = "../../LICENSE"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
