# Disposable Postgres for blueprint Phase C probes.
# Usage:
#   docker compose -f examples/blueprint/docker-compose.db.yml up -d
#   export DATABASE_URL=postgres://jhol:jhol@127.0.0.1:5433/jhol
#   jhol db probe
#   jhol db plan --path examples/blueprint
#   docker compose -f examples/blueprint/docker-compose.db.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jhol
      POSTGRES_PASSWORD: jhol
      POSTGRES_DB: jhol
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhol -d jhol"]
      interval: 2s
      timeout: 5s
      retries: 10
