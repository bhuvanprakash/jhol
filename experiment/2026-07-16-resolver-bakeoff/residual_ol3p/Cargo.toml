[package]
name = "residual-ol3p-experiment"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experiment-only Residual-Certified OL3P prototype (does not modify jhol)"

# Independent workspace so we do not touch the root Cargo.toml members list.
[workspace]

[dependencies]
jhol-core = { path = "../../../crates/jhol-core", default-features = false, features = ["http-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
semver = "1"
